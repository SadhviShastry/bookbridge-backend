# ==========================================================================
# BookBridge backend config — all values come from environment variables so
# the same jar runs locally (with a .env / IDE run config) and on Render/
# Railway (set these as dashboard "Environment Variables").
# ==========================================================================

server.port=${PORT:8080}

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookbridge}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" auto-creates/updates tables from the entities below — perfect for
# a college project. Switch to "validate" once your schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
# Generate your own long random string for production — never reuse this.
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying-CHANGE-ME-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---- CORS ----
# Comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

# ---- Logging ----
logging.level.org.springframework.security=INFO
